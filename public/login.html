<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICO - Acceso al Sistema</title>
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Externos -->
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/login.css">
</head>

<body class="auth-body">

    <main class="auth-wrapper">
        <div class="auth-card shadow-lg">

            <!-- Panel izquierdo corporativo -->
            <div class="auth-brand-panel">
                <a href="index.html" class="auth-back-link">
                    <i class="bi bi-arrow-left me-1"></i> Volver al inicio
                </a>

                <div class="auth-brand-content">
                    <img src="./assets/img/Logo Rico/logo oficial blanco - fondo transparente.png"
                        alt="Logo RICO Alimentos" class="auth-logo mb-4">
                    <h2 class="fw-bold mb-2">Portal de Acceso</h2>
                    <p class="mb-0 text-white-50">
                        Ingresa con tu cuenta de administrador para gestionar el catálogo de productos de RICO Alimentos.
                    </p>
                </div>

                <small class="text-white-50">&copy; 2026 RICO Alimentos · UTP</small>
            </div>

            <!-- Panel derecho de formularios -->
            <div class="auth-form-panel">

                <!-- Pestañas Login / Registro -->
                <ul class="nav nav-pills nav-fill auth-tabs mb-4" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold" id="tab-login" data-bs-toggle="pill"
                            data-bs-target="#panel-login" type="button" role="tab">
                            <i class="bi bi-shield-lock me-1"></i> Iniciar Sesión
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold" id="tab-registro" data-bs-toggle="pill"
                            data-bs-target="#panel-registro" type="button" role="tab">
                            <i class="bi bi-person-plus me-1"></i> Registrarse
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- FORMULARIO LOGIN -->
                    <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
                        <h4 class="fw-bold mb-1">Bienvenido de vuelta</h4>
                        <p class="text-muted small mb-4">Ingresa tus credenciales para acceder al panel.</p>

                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="loginUsuario">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person text-danger"></i></span>
                                    <input type="text" id="loginUsuario" class="form-control" name="usuario"
                                        placeholder="Ej. admin" required autocomplete="username">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold" for="loginClave">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock text-danger"></i></span>
                                    <input type="password" id="loginClave" class="form-control" name="clave"
                                        placeholder="••••••••" required autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" id="btnVerClave"
                                        aria-label="Mostrar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
                            </button>
                        </form>
                    </div>

                    <!-- FORMULARIO REGISTRO -->
                    <div class="tab-pane fade" id="panel-registro" role="tabpanel">
                        <h4 class="fw-bold mb-1">Crear cuenta nueva</h4>
                        <p class="text-muted small mb-4">Completa tus datos para solicitar acceso.</p>

                        <form id="formRegistro">
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="regNombre">Nombre Completo</label>
                                <input type="text" id="regNombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="regCorreo">Correo Electrónico</label>
                                <input type="email" id="regCorreo" class="form-control" placeholder="usuario@correo.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold" for="regClave">Crear Contraseña</label>
                                <input type="password" id="regClave" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">
                                <i class="bi bi-person-check-fill me-2"></i>Registrarme Ahora
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/alertas.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
