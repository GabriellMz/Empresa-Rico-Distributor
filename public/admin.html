<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICO - Panel de Administración</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/admin.css">
    <script src="js/sesion.js"></script>
</head>

<body class="admin-body">

    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-brand">
                <img src="./assets/img/Logo Rico/logo oficial blanco - fondo transparente.png" alt="Logo RICO"
                    class="sidebar-logo">
            </div>

            <nav class="sidebar-nav">
                <a href="admin.html" class="sidebar-link active">
                    <i class="bi bi-box-seam-fill"></i>
                    <span>Productos</span>
                </a>
                <a href="index.html" class="sidebar-link" target="_blank" rel="noopener">
                    <i class="bi bi-globe2"></i>
                    <span>Ver sitio público</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <!--
                    Botón de Cerrar Sesión.
                    La lógica de abajo (js/admin-ui.js) solo limpia la sesión guardada
                    en el navegador y redirige a index.html como comportamiento por
                    defecto. Manuel: ajusta esto a tu mecanismo real de sesión si usas
                    otra cosa (token, cookie, etc.) en tu módulo de autenticación.
                -->
                <button type="button" class="btn btn-outline-light w-100" id="btnCerrarSesion">
                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Overlay para cerrar el sidebar en móvil -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main -->
        <div class="admin-main">

            <header class="admin-topbar">
                <button type="button" class="btn-sidebar-toggle d-lg-none" id="btnToggleSidebar"
                    aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="admin-topbar-title">Panel de Administración</h1>
                <div class="admin-topbar-admin">
                    <i class="bi bi-person-circle"></i>
                    <!-- Manuel: puedes reemplazar este texto con el nombre real de la sesión -->
                    <span id="nombreAdminSesion">Administrador</span>
                </div>
            </header>

            <main class="admin-content">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div>
                        <h2 class="admin-section-title mb-1">Gestión de Productos</h2>
                        <p class="text-muted mb-0 small">Administra el catálogo de productos de RICO Alimentos.</p>
                    </div>
                    <button type="button" class="btn btn-danger fw-bold" data-bs-toggle="modal"
                        data-bs-target="#modalProducto" id="btnNuevoProducto">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
                    </button>
                </div>

                <div class="card admin-card border-0">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-3">
                        <div class="input-group admin-search">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" id="inputBusquedaProductos" class="form-control border-start-0"
                                placeholder="Buscar producto por nombre...">
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 admin-table">
                                <thead>
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Imagen</th>
                                        <th scope="col">Nombre</th>
                                        <th scope="col">Marca</th>
                                        <th scope="col">Precio</th>
                                        <th scope="col">Descripción</th>
                                        <th scope="col" class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductosBody">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="admin-footer">
                <p class="mb-0 small">RICO Alimentos &copy; 2026 · Panel interno de administración</p>
            </footer>
        </div>
    </div>

    <!-- ==========================================
         MODAL: NUEVO / EDITAR PRODUCTO
         ========================================== -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold" id="modalProductoLabel">
                        <i class="bi bi-box-seam me-2"></i>Nuevo Producto
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form id="formProducto">
                    <div class="modal-body p-4">
                        <input type="hidden" id="inputIdProducto" name="id_producto">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" id="inputNombreProducto" name="nombre" required
                                    placeholder="Ej. Pollo Fresco">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Marca</label>
                                <input type="text" class="form-control" id="inputMarcaProducto" name="marca" required
                                    placeholder="Ej. Rico Pollo">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Precio (S/)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="inputPrecioProducto"
                                    name="precio" required placeholder="0.00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Vencimiento / Duración</label>
                                <input type="text" class="form-control" id="inputVencimientoProducto"
                                    name="vencimiento_duracion" placeholder="Ej. 7 días refrigerado">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Imagen del Producto</label>
                                <input type="file" class="form-control" id="inputArchivoImagen" accept="image/*">
                                <input type="hidden" id="inputImagenProducto" name="imagen">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Descripción</label>
                                <textarea class="form-control" id="inputDescripcionProducto" name="descripcion" rows="3"
                                    required placeholder="Describe el producto..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-danger fw-bold" id="btnGuardarProducto">
                            <i class="bi bi-save me-1"></i>Guardar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/alertas.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-productos.js"></script>
</body>

</html>
